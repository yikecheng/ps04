name: Import completed PS04 submission

on:
  push:
    paths:
      - ps04-submission.tar.gz

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed submission
        run: |
          tar -xzf ps04-submission.tar.gz
          rm ps04-submission.tar.gz
      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PS04 implementation and evidence package"
          git push
